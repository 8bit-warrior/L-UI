name: Apply 3x-ui import repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore: run 3x-ui import repair'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch importer and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/lui-3xui-import-patch.py
          python3 /tmp/lui-3xui-import-patch.py
          gofmt -w internal/app/migrate.go internal/app/xray.go internal/app/import_sanitize_test.go
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/migrate.go internal/app/xray.go internal/app/import_sanitize_test.go
          git commit -m 'fix: sanitize 3x-ui control-plane routes on import'
          git push origin HEAD:main
