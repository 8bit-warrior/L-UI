name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile lui.py src/*.py
      - name: Smoke self-check
        env:
          LUI_HOME: /tmp/lui-ci
          LUI_BIN_DIR: /tmp/lui-ci/bin
          LUI_LOG_DIR: /tmp/lui-ci/logs
        run: python lui.py self-check
